<script>
    // =========== CONFIGURATION ===========
    const API_BASE = 'http://localhost:5000/api'; // Change to your deployed backend URL
    let currentUserUid = null;
    let currentBalance = 0;
    let authToken = localStorage.getItem('authToken') || null;
    let isMuted = false;

    // =========== SOUND ENGINE ===========
    const soundEffects = {
        click: new Audio('https://cdn.pixabay.com/download/audio/2021/08/04/audio_bb630cc098.mp3'),
        bet: new Audio('https://cdn.pixabay.com/download/audio/2022/03/07/audio_2747a32a2d.mp3'),
        win: new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_2b68c40131.mp3'),
        lose: new Audio('https://cdn.pixabay.com/download/audio/2022/03/10/audio_c970a047a2.mp3'),
        gem: new Audio('https://cdn.pixabay.com/download/audio/2022/01/18/audio_7354de7365.mp3'),
        bomb: new Audio('https://cdn.pixabay.com/download/audio/2021/08/04/audio_12b0c342f7.mp3'),
        cashout: new Audio('https://cdn.pixabay.com/download/audio/2022/03/07/audio_2747a32a2d.mp3'),
        tick: new Audio('https://cdn.pixabay.com/download/audio/2022/11/22/audio_2c8a3ce2b9.mp3'),
        pop: new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_1731a6136a.mp3'),
        spinLoop: new Audio('https://cdn.pixabay.com/download/audio/2022/07/16/audio_a168c48a7b.mp3'),
        reelStop: new Audio('https://cdn.pixabay.com/download/audio/2022/03/13/audio_23c893d56a.mp3'),
        inflateLoop: new Audio('https://cdn.pixabay.com/download/audio/2022/08/03/audio_92de418d10.mp3'),
        kenoDraw: new Audio('https://cdn.pixabay.com/download/audio/2021/08/04/audio_165a898a96.mp3'),
    };
    soundEffects.spinLoop.loop = true;
    soundEffects.inflateLoop.loop = true;

    function playSound(name) {
        if (isMuted || !soundEffects[name]) return;
        soundEffects[name].currentTime = 0;
        soundEffects[name].play().catch(() => {});
    }
    function stopSound(name) {
        if (!soundEffects[name]) return;
        soundEffects[name].pause();
        soundEffects[name].currentTime = 0;
    }

    // =========== API HELPER ===========
    async function api(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

        const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'API request failed');
        }
        return data;
    }

    // =========== AUTH ===========
    document.getElementById('show-signup').addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('signup-form').style.display = 'block';
    });
    document.getElementById('show-login').addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('signup-form').style.display = 'none';
        document.getElementById('login-form').style.display = 'block';
    });

    document.getElementById('signup-btn').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        const errorEl = document.getElementById('signup-error');
        errorEl.style.display = 'none';

        try {
            const data = await api('/auth/register', {
                method: 'POST',
                body: JSON.stringify({ email, password })
            });
            authToken = data.token;
            localStorage.setItem('authToken', authToken);
            onLoginSuccess(data.user);
        } catch (error) {
            errorEl.textContent = error.message;
            errorEl.style.display = 'block';
        }
    });

    document.getElementById('login-btn').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const errorEl = document.getElementById('login-error');
        errorEl.style.display = 'none';

        try {
            const data = await api('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ email, password })
            });
            authToken = data.token;
            localStorage.setItem('authToken', authToken);
            onLoginSuccess(data.user);
        } catch (error) {
            errorEl.textContent = error.message;
            errorEl.style.display = 'block';
        }
    });

    document.getElementById('logout-link').addEventListener('click', (e) => {
        e.preventDefault();
        authToken = null;
        currentUserUid = null;
        currentBalance = 0;
        localStorage.removeItem('authToken');
        showAuthScreen();
    });

    function onLoginSuccess(user) {
        currentUserUid = user.uid;
        currentBalance = user.balance || 0;
        document.getElementById('auth-container').style.display = 'none';
        document.querySelector('.main-wrapper').style.display = 'flex';
        updateBalanceDisplay(currentBalance);
        loadUserData();

        const sidebarHeader = document.querySelector('.sidebar-header h2');
        if (sidebarHeader) sidebarHeader.innerHTML = `Menu<br><small style="font-size: 0.6em; color: var(--text-secondary);">${user.email}</small>`;
    }

    function showAuthScreen() {
        document.getElementById('auth-container').style.display = 'flex';
        document.querySelector('.main-wrapper').style.display = 'none';
    }

    function updateBalanceDisplay(balance) {
        currentBalance = balance;
        const formatted = balance.toFixed(2);
        const walletEl = document.getElementById('wallet_balance');
        if (walletEl) walletEl.textContent = formatted;
        document.querySelectorAll('.game-balance-value').forEach(el => el.textContent = '₹' + formatted);
        const withdrawDialogBalance = document.getElementById('withdraw-dialog-balance');
        if (withdrawDialogBalance) withdrawDialogBalance.textContent = formatted;
    }

    async function loadUserData() {
        try {
            const [balanceData, txData] = await Promise.all([
                api('/wallet/balance'),
                api('/wallet/transactions')
            ]);
            updateBalanceDisplay(balanceData.balance);
            renderTransactions(txData.transactions);
            loadCtHistory();
            loadPromotions();
        } catch (error) {
            console.error('Failed to load user data:', error);
            if (error.message.includes('token') || error.message.includes('401')) {
                authToken = null;
                localStorage.removeItem('authToken');
                showAuthScreen();
            }
        }
    }

    function renderTransactions(transactions) {
        const tbody = document.getElementById('transaction_history_body');
        if (!tbody) return;
        if (!transactions || transactions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--text-secondary);">No transactions yet.</td></tr>';
            return;
        }
        tbody.innerHTML = transactions.map(tx => `
            <tr>
                <td>${tx.description}</td>
                <td class="${tx.amount > 0 ? 'tx-credit' : 'tx-debit'}">${tx.amount > 0 ? '+' : ''}${tx.amount.toFixed(2)}</td>
                <td>${tx.date || '...'}</td>
            </tr>
        `).join('');
    }

    // =========== SIDEBAR & PAGES ===========
    window.toggleSidebar = function() {
        playSound('click');
        document.getElementById("sidebar").classList.toggle("open");
        document.getElementById("sidebar-overlay").classList.toggle("open");
    };

    document.querySelectorAll(".nav-link").forEach(el => el.addEventListener("click", e => {
        e.preventDefault();
        const page = e.currentTarget.dataset.page;
        if (page) showPage(page);
        document.querySelectorAll(".nav-link").forEach(n => n.classList.remove("active"));
        e.currentTarget.classList.add("active");
        if (document.getElementById("sidebar").classList.contains("open")) toggleSidebar();
    }));

    function showPage(pageId) {
        if (window.stopAllGames) stopAllGames();
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        const target = document.getElementById(pageId);
        if (target) target.classList.add("active");

        const navLink = document.querySelector(`.nav-link[data-page="${pageId}"]`);
        document.getElementById("page-title").textContent = navLink ? navLink.textContent.trim().substring(1).trim() : "Home";

        switch (pageId) {
            case "color-trading-page": startColorTradingGame(); break;
            case "mines-game-page": startMinesGame(); break;
            case "leaderboard-page": startLeaderboard(); break;
            case "hotline-page": startHotlineGame(); break;
            case "balloon-page": startBalloonGame(); break;
            case "keno-page": startKenoGame(); break;
        }
    }

    // =========== LEADERBOARD ===========
    let leaderboardInterval = null;
    async function startLeaderboard() {
        const tbody = document.getElementById('leaderboard_body');
        if (!tbody) return;

        async function load() {
            try {
                tbody.innerHTML = '<tr><td colspan="3"><div class="loader-small"></div></td></tr>';
                const data = await api('/leaderboard/top?limit=10');
                if (data.players.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--text-secondary);">No players yet.</td></tr>';
                    return;
                }
                tbody.innerHTML = data.players.map((p, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${p.email}</td>
                        <td>₹${p.balance.toFixed(2)}</td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--accent-red);">Error loading data.</td></tr>';
            }
        }

        await load();
        if (leaderboardInterval) clearInterval(leaderboardInterval);
        leaderboardInterval = setInterval(load, 10000);
    }

    // =========== WALLET - DEPOSIT ===========
    function initializeDepositDialog() {
        const depositBtn = document.getElementById('deposit-btn');
        const overlay = document.getElementById('deposit-dialog-overlay');
        const closeBtn = document.getElementById('close-deposit-dialog');
        const copyBtn = document.getElementById('copy-upi-btn');
        const upiText = document.getElementById('upi-id-text');
        const amountBtns = document.querySelectorAll('#deposit-dialog-overlay .btn-amount');
        const amountInput = document.getElementById('deposit-amount');
        const utrInput = document.getElementById('deposit-utr');
        const submitBtn = document.getElementById('submit-deposit-btn');

        depositBtn.addEventListener('click', () => overlay.classList.add('show'));
        closeBtn.addEventListener('click', () => overlay.classList.remove('show'));
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(upiText.textContent).then(() => {
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = 'Copy', 2000);
            });
        });

        amountBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                amountInput.value = btn.textContent.replace('₹', '');
            });
        });

        submitBtn.addEventListener('click', async () => {
            const amount = parseFloat(amountInput.value);
            const utr = utrInput.value.trim();

            if (isNaN(amount) || amount < 100) return alert('Minimum deposit is ₹100');
            if (!utr || utr.length !== 12) return alert('Enter valid 12-digit UTR');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                await api('/wallet/deposit', {
                    method: 'POST',
                    body: JSON.stringify({ amount, utr })
                });
                alert('Deposit request submitted! Wait for admin approval.');
                overlay.classList.remove('show');
                amountInput.value = '';
                utrInput.value = '';
            } catch (error) {
                alert(error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'I have paid, Submit Request';
            }
        });
    }

    // =========== WALLET - WITHDRAW ===========
    function initializeWithdrawDialog() {
        const withdrawBtn = document.getElementById('withdraw-btn');
        const overlay = document.getElementById('withdraw-dialog-overlay');
        const closeBtn = document.getElementById('close-withdraw-dialog');
        const submitBtn = document.getElementById('submit-withdraw-btn');
        const upiInput = document.getElementById('withdraw-upi');
        const amountInput = document.getElementById('withdraw-amount');
        const confirmOverlay = document.getElementById('withdraw-confirm-dialog-overlay');
        const confirmAmount = document.getElementById('confirm-withdraw-amount');
        const confirmUpi = document.getElementById('confirm-withdraw-upi');
        const confirmBtn = document.getElementById('confirm-withdraw-btn');
        const cancelBtn = document.getElementById('cancel-withdraw-confirmation');

        withdrawBtn.addEventListener('click', () => {
            document.getElementById('withdraw-dialog-balance').textContent = currentBalance.toFixed(2);
            overlay.classList.add('show');
        });
        closeBtn.addEventListener('click', () => overlay.classList.remove('show'));

        cancelBtn.addEventListener('click', () => confirmOverlay.classList.remove('show'));

        submitBtn.addEventListener('click', () => {
            const upi = upiInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (!upi || !upi.includes('@')) return alert('Enter valid UPI ID');
            if (isNaN(amount) || amount < 100) return alert('Minimum withdrawal is ₹100');
            if (amount > currentBalance) return alert('Insufficient balance');

            confirmAmount.textContent = `₹${amount.toFixed(2)}`;
            confirmUpi.textContent = upi;
            confirmOverlay.classList.add('show');
        });

        confirmBtn.addEventListener('click', async () => {
            const upi = upiInput.value.trim();
            const amount = parseFloat(amountInput.value);

            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Processing...';

            try {
                const data = await api('/wallet/withdraw', {
                    method: 'POST',
                    body: JSON.stringify({ upiNumber: upi, amount })
                });
                updateBalanceDisplay(data.newBalance);
                alert('Withdrawal request submitted!');
                confirmOverlay.classList.remove('show');
                overlay.classList.remove('show');
                upiInput.value = '';
                amountInput.value = '';
                loadUserData();
            } catch (error) {
                alert(error.message);
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.textContent = 'Confirm';
            }
        });
    }

    // =========== COLOR TRADING ===========
    let ct_periodId = null;
    let ct_countdown = 60;
    let ct_interval = null;
    let ct_isRoundEnding = false;
    let ct_isAutoPlaying = false;
    let ct_autoRoundsLeft = 0;
    let ct_autoTimeout = null;
    let pendingCtBet = null;

    function getCurrentCtPeriod() {
        const d = new Date();
        return `${d.getFullYear()}${(d.getMonth() + 1).toString().padStart(2, '0')}${d.getDate().toString().padStart(2, '0')}${String(Math.floor(d.getUTCHours() * 60 + d.getUTCMinutes())).padStart(4, '0')}`;
    }

    function initializeCtConfirmDialog() {
        const overlay = document.getElementById('ct-confirm-dialog-overlay');
        const confirmBtn = document.getElementById('confirm-ct-bet-btn');
        const cancelBtn = document.getElementById('cancel-ct-confirmation');

        cancelBtn.addEventListener('click', () => {
            overlay.classList.remove('show');
            pendingCtBet = null;
        });

        confirmBtn.addEventListener('click', async () => {
            if (!pendingCtBet) return;
            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Processing...';

            try {
                await executeCtBet(pendingCtBet.type, pendingCtBet.value, pendingCtBet.amount);
            } catch (error) {
                alert(error.message);
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.textContent = 'Confirm Bet';
                overlay.classList.remove('show');
                pendingCtBet = null;
            }
        });
    }

    async function executeCtBet(type, value, amount) {
        const data = await api('/games/ct/bet', {
            method: 'POST',
            body: JSON.stringify({ period: ct_periodId, type, value, amount })
        });
        updateBalanceDisplay(data.newBalance);
        playSound('bet');
        await loadCtHistory();
        return data;
    }

    function startColorTradingGame() {
        if (ct_interval) clearInterval(ct_interval);

        const numberGrid = document.getElementById('ct_number_grid');
        const timerEl = document.getElementById('ct_timer');
        const periodEl = document.getElementById('ct_period');

        if (!numberGrid.dataset.initialized) {
            numberGrid.innerHTML = '';
            const numberImages = [
                'https://i.ibb.co/JWsTpKzy/file-00000000888c61f5b9918f5f0c5e441c.png',
                'https://i.ibb.co/rG4V1V6x/file-00000000743c622f8a519067b7a6b01b.png',
                'https://i.ibb.co/8LTg2N47/file-000000005a6062308b7e60f5c324a9d5.png',
                'https://i.ibb.co/wFsHrRsg/file-00000000f4a861f7bd5e2241fbe89e1b.png',
                'https://i.ibb.co/fdn9r4fW/file-000000007408622f82d0e1ccf9b10671.png',
                'https://i.ibb.co/jc6z0y7/file-00000000efe46230882776e4c018472f.png',
                'https://i.ibb.co/YYqL9k4/file-00000000f16861f8b7a2c3379a2662f1.png',
                'https://i.ibb.co/99p2dXmV/file-0000000037a461f88abc1709c2401377.png',
                'https://i.ibb.co/LzVwH4Xb/file-000000003fa061f88628919a9560b7f7.png',
                'https://i.ibb.co/DgYwxN7r/file-00000000e8546230b05909132da85d93.png'
            ];
            for (let i = 0; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'ct-number-btn';
                const img = document.createElement('img');
                img.src = numberImages[i];
                img.alt = `Number ${i}`;
                btn.appendChild(img);
                btn.onclick = () => ctPlaceBet('number', i);
                numberGrid.appendChild(btn);
            }
            numberGrid.dataset.initialized = 'true';
        }

        ct_periodId = getCurrentCtPeriod();
        periodEl.textContent = ct_periodId;
        ct_countdown = 60 - new Date().getSeconds();
        ct_isRoundEnding = false;

        ct_interval = setInterval(() => {
            ct_countdown--;
            if (ct_countdown < 0) ct_countdown = 0;
            timerEl.textContent = `00:${ct_countdown.toString().padStart(2, '0')}`;

            if (ct_countdown <= 5) {
                timerEl.style.color = 'var(--accent-red)';
            } else {
                timerEl.style.color = 'white';
            }

            if (ct_countdown <= 10 && ct_countdown > 0) playSound('tick');

            if (ct_countdown <= 0) {
                clearInterval(ct_interval);
                ct_interval = null;
                stopSound('tick');
                endCtRound();
            }
        }, 1000);
    }

    async function endCtRound() {
        if (ct_isRoundEnding) return;
        ct_isRoundEnding = true;

        // Wait for server to process
        await new Promise(r => setTimeout(r, 3000));

        // Load game history
        await loadCtHistory();

        // Wait a bit more and restart
        setTimeout(() => {
            ct_isRoundEnding = false;
            startColorTradingGame();
        }, 2000);
    }

    async function loadCtHistory() {
        try {
            const [gameData, myData] = await Promise.all([
                api('/games/ct/history'),
                api('/games/ct/my-history')
            ]);

            const gameBody = document.getElementById('ct_game_history_body');
            if (gameBody) {
                gameBody.innerHTML = gameData.history.map(g => {
                    const circles = g.winColors.map(c => 
                        `<span style="color:var(--accent-${c === 'Green' ? 'green' : c === 'Red' ? 'red' : 'purple'}); font-size: 1.5em; line-height: 1;">●</span>`
                    ).join('');
                    return `<tr><td>${g.period.slice(-4)}</td><td>${g.winNum}</td><td>${g.winSize}</td><td>${circles}</td></tr>`;
                }).join('');
            }

            const myBody = document.getElementById('ct_my_history_body');
            if (myBody) {
                myBody.innerHTML = myData.history.map(b => {
                    let resultText = 'Waiting';
                    if (b.result !== 'waiting') {
                        resultText = b.result > 0 
                            ? `<span style="color:var(--accent-green)">+${b.result.toFixed(2)}</span>`
                            : `<span style="color:var(--accent-red)">${b.result.toFixed(2)}</span>`;
                    }
                    return `<tr><td>${b.period.slice(-4)}</td><td>${b.value}</td><td>${b.amount.toFixed(2)}</td><td>${resultText}</td></tr>`;
                }).join('');
            }
        } catch (error) {
            console.error('Failed to load CT history:', error);
        }
    }

    function ctPlaceBet(type, value) {
        if (ct_countdown <= 5 || ct_isAutoPlaying || ct_isRoundEnding) return;
        playSound('click');

        const amount = parseFloat(document.getElementById('ct_bet_amount').value);
        if (isNaN(amount) || amount <= 0) return alert('Enter valid bet amount');
        if (amount > currentBalance) return alert('Insufficient balance');

        pendingCtBet = { type, value, amount };
        document.getElementById('confirm-ct-bet-amount').textContent = `₹${amount.toFixed(2)}`;
        document.getElementById('confirm-ct-bet-selection').textContent = value;
        document.getElementById('ct-confirm-dialog-overlay').classList.add('show');
    }

    function ctMultiplyBet(mult) {
        if (ct_isAutoPlaying || ct_isRoundEnding) return;
        playSound('click');
        const current = parseFloat(document.getElementById('ct_bet_amount').value) || 10;
        document.getElementById('ct_bet_amount').value = (current * mult).toFixed(0);
    }

    // Auto-play setup
    document.getElementById('ct_auto_toggle').addEventListener('change', (e) => {
        document.getElementById('ct_auto_panel').style.display = e.target.checked ? 'block' : 'none';
        if (!e.target.checked) ctStopAutoPlay();
    });

    document.getElementById('ct_auto_action_btn').addEventListener('click', () => {
        if (ct_isAutoPlaying) ctStopAutoPlay('Auto-play stopped by user.');
        else ctStartAutoPlay();
    });

    function ctStartAutoPlay() {
        const rounds = parseInt(document.getElementById('ct_auto_rounds').value);
        const betAmount = parseFloat(document.getElementById('ct_bet_amount').value);

        if (isNaN(rounds) || rounds < 1) return alert('Invalid rounds');
        if (isNaN(betAmount) || betAmount <= 0) return alert('Invalid bet amount');
        if (betAmount > currentBalance) return alert('Insufficient balance');

        ct_isAutoPlaying = true;
        ct_autoRoundsLeft = rounds;
        document.getElementById('ct_auto_action_btn').textContent = `Running... (${ct_autoRoundsLeft} left)`;
        document.getElementById('ct_auto_action_btn').className = 'btn btn-red';
        ctScheduleAutoBet();
    }

    function ctScheduleAutoBet() {
        const delay = ct_countdown > 15 ? (ct_countdown - 15) * 1000 + Math.random() * 3000 : 1000;
        ct_autoTimeout = setTimeout(ctExecuteAutoBet, delay);
    }

    async function ctExecuteAutoBet() {
        if (!ct_isAutoPlaying || ct_autoRoundsLeft <= 0) return ctStopAutoPlay('Auto-play finished.');

        const betAmount = parseFloat(document.getElementById('ct_bet_amount').value);
        if (currentBalance < betAmount) return ctStopAutoPlay('Auto-play stopped: insufficient funds.');

        const strategy = document.getElementById('ct_auto_strategy').value;
        let type = 'color';
        let value = 'Green';

        switch (strategy) {
            case 'Red': value = 'Red'; break;
            case 'Violet': value = 'Violet'; break;
            case 'Big': type = 'size'; value = 'Big'; break;
            case 'Small': type = 'size'; value = 'Small'; break;
            case 'random_color': value = ['Green', 'Red', 'Violet'][Math.floor(Math.random() * 3)]; break;
            case 'random_number': type = 'number'; value = Math.floor(Math.random() * 10); break;
        }

        try {
            await executeCtBet(type, value, betAmount);
            ct_autoRoundsLeft--;
            if (ct_isAutoPlaying) {
                document.getElementById('ct_auto_action_btn').textContent = `Running... (${ct_autoRoundsLeft} left)`;
                if (ct_autoRoundsLeft > 0) ctScheduleAutoBet();
                else ctStopAutoPlay('Auto-play finished.');
            }
        } catch (error) {
            ctStopAutoPlay('Auto-play stopped: ' + error.message);
        }
    }

    function ctStopAutoPlay(reason) {
        if (!ct_isAutoPlaying && !reason) return;
        ct_isAutoPlaying = false;
        ct_autoRoundsLeft = 0;
        clearTimeout(ct_autoTimeout);
        const btn = document.getElementById('ct_auto_action_btn');
        if (btn) {
            btn.textContent = 'Start Auto Play';
            btn.className = 'btn btn-green';
        }
        if (reason) alert(reason);
    }

    // =========== MINES ===========
    let minesActiveGame = null;
    let minesAutoBetting = false;
    let minesAutoGamesLeft = 0;
    let minesAutoTimeout = null;

    function calculateMinesMultiplier(gemsFound, mineCount) {
        if (gemsFound === 0) return 1;
        let mult = 1;
        for (let i = 0; i < gemsFound; i++) {
            mult *= (25 - mineCount - i) / (25 - i);
        }
        return 0.95 / mult;
    }

    function startMinesGame() {
        const grid = document.getElementById('mines_grid');
        const actionBtn = document.getElementById('mines_action_btn');
        const autoToggle = document.getElementById('mines_auto_toggle');

        if (!grid.dataset.initialized) {
            resetMinesGrid();
            actionBtn.addEventListener('click', handleMinesActionClick);
            autoToggle.addEventListener('change', (e) => {
                document.getElementById('mines_auto_panel').style.display = e.target.checked ? 'block' : 'none';
                if (!e.target.checked) minesStopAuto();
                updateMinesButton();
            });
            grid.dataset.initialized = 'true';
        }

        loadActiveMinesGame();
    }

    function resetMinesGrid() {
        const grid = document.getElementById('mines_grid');
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const tile = document.createElement('div');
            tile.className = 'mine-tile';
            tile.dataset.index = i;
            tile.innerHTML = '<div class="face front"></div><div class="face back"></div>';
            grid.appendChild(tile);
        }
    }

    async function loadActiveMinesGame() {
        try {
            const data = await api('/games/mines/active');
            if (data.active) {
                minesActiveGame = data;
                // Restore revealed tiles
                data.revealedTiles.forEach(idx => {
                    const tile = document.querySelector(`.mine-tile[data-index="${idx}"]`);
                    if (tile) {
                        tile.classList.add('revealed', 'gem');
                        tile.onclick = null;
                    }
                });
                // Setup onclick for remaining
                document.querySelectorAll('.mine-tile:not(.revealed)').forEach(tile => {
                    tile.onclick = () => onMinesTileClick(tile);
                });
                updateMinesProfitInfo();
            }
            updateMinesButton();
        } catch (error) {
            console.error('Failed to load active mines game:', error);
        }
    }

    function updateMinesButton() {
        const btn = document.getElementById('mines_action_btn');
        const autoToggle = document.getElementById('mines_auto_toggle');

        if (minesAutoBetting) {
            btn.textContent = `STOP AUTO (${minesAutoGamesLeft} left)`;
            btn.className = 'btn btn-red';
        } else if (minesActiveGame) {
            const profit = minesActiveGame.betAmount * minesActiveGame.multiplier;
            btn.textContent = `CASHOUT (₹${profit.toFixed(2)})`;
            btn.className = 'btn btn-primary';
        } else {
            btn.textContent = autoToggle.checked ? 'START AUTO BET' : 'BET';
            btn.className = 'btn btn-green';
        }
        btn.disabled = false;
    }

    async function handleMinesActionClick() {
        playSound('click');
        const autoToggle = document.getElementById('mines_auto_toggle');

        if (autoToggle.checked) {
            if (minesAutoBetting) minesStopAuto('Auto-bet stopped by user.');
            else minesStartAuto();
        } else {
            if (minesActiveGame) {
                await minesCashout();
            } else {
                await minesStartGame();
            }
        }
    }

    async function minesStartGame() {
        const betAmount = parseFloat(document.getElementById('mines_betAmount').value);
        const mineCount = parseInt(document.getElementById('mines_mineCount').value);

        if (isNaN(betAmount) || betAmount <= 0) return alert('Invalid bet amount');
        if (betAmount > currentBalance) return alert('Insufficient balance');
        if (isNaN(mineCount) || mineCount < 1 || mineCount > 20) return alert('Mine count must be 1-20');

        const btn = document.getElementById('mines_action_btn');
        btn.disabled = true;

        try {
            const data = await api('/games/mines/start', {
                method: 'POST',
                body: JSON.stringify({ betAmount, mineCount })
            });
            updateBalanceDisplay(data.newBalance);
            playSound('bet');

            minesActiveGame = {
                betAmount,
                mineCount,
                revealedTiles: [],
                gemsFound: 0,
                multiplier: 1
            };

            resetMinesGrid();
            document.querySelectorAll('.mine-tile').forEach(tile => {
                tile.onclick = () => onMinesTileClick(tile);
            });
            updateMinesProfitInfo();
            updateMinesButton();
        } catch (error) {
            alert(error.message);
            btn.disabled = false;
        }
    }

    async function onMinesTileClick(tile) {
        if (!minesActiveGame || tile.classList.contains('revealed')) return;

        const idx = parseInt(tile.dataset.index);

        try {
            const data = await api('/games/mines/reveal', {
                method: 'POST',
                body: JSON.stringify({ tileIndex: idx })
            });

            if (data.hitMine) {
                playSound('bomb');
                tile.classList.add('revealed', 'bomb');
                document.getElementById('mines_grid').classList.add('shake-effect');

                // Reveal all mines
                data.minePositions.forEach(mIdx => {
                    const t = document.querySelector(`.mine-tile[data-index="${mIdx}"]`);
                    if (t) t.classList.add('revealed', 'bomb');
                });

                setTimeout(() => {
                    document.getElementById('mines_grid').classList.remove('shake-effect');
                    minesShowDialog('loss', data.amountLost);
                }, 500);

                minesActiveGame = null;
                document.querySelectorAll('.mine-tile').forEach(t => t.onclick = null);
                updateMinesButton();
            } else {
                playSound('gem');
                tile.classList.add('revealed', 'gem');
                tile.onclick = null;

                minesActiveGame.revealedTiles.push(idx);
                minesActiveGame.gemsFound = data.gemsFound;
                minesActiveGame.multiplier = data.multiplier;
                updateMinesProfitInfo();
                updateMinesButton();
            }
        } catch (error) {
            alert(error.message);
        }
    }

    async function minesCashout() {
        const btn = document.getElementById('mines_action_btn');
        btn.disabled = true;
        playSound('cashout');

        try {
            const data = await api('/games/mines/cashout', { method: 'POST' });
            updateBalanceDisplay(data.newBalance);
            minesShowDialog('win', data.profit);
            minesActiveGame = null;
            resetMinesGrid();
            updateMinesProfitInfo();
            updateMinesButton();
        } catch (error) {
            alert(error.message);
            btn.disabled = false;
        }
    }

    function updateMinesProfitInfo() {
        if (!minesActiveGame) {
            document.getElementById('mines_next_profit').textContent = '--';
            document.getElementById('mines_total_profit').textContent = '--';
            return;
        }

        const totalProfit = minesActiveGame.betAmount * minesActiveGame.multiplier - minesActiveGame.betAmount;
        const nextMult = calculateMinesMultiplier(minesActiveGame.gemsFound + 1, minesActiveGame.mineCount);
        const nextProfit = minesActiveGame.betAmount * nextMult - minesActiveGame.betAmount;

        document.getElementById('mines_next_profit').textContent = `₹${nextProfit.toFixed(2)}`;
        document.getElementById('mines_total_profit').textContent = `₹${totalProfit.toFixed(2)}`;
    }

    function minesShowDialog(type, amount) {
        const overlay = document.getElementById('mines_dialog_overlay');
        const winDialog = document.querySelector('#mines_dialog_overlay .mines-win-dialog');
        const lossDialog = document.querySelector('#mines_dialog_overlay .mines-loss-dialog');

        if (type === 'win') {
            playSound('win');
            document.getElementById('mines_win_dialog_profit').textContent = `+₹${amount.toFixed(2)}`;
            winDialog.style.display = 'block';
            lossDialog.style.display = 'none';
        } else {
            playSound('lose');
            document.getElementById('mines_loss_dialog_amount').textContent = `-₹${amount.toFixed(2)}`;
            winDialog.style.display = 'none';
            lossDialog.style.display = 'block';
        }

        overlay.classList.add('show');
    }

    window.mines_hideDialog = function() {
        document.getElementById('mines_dialog_overlay').classList.remove('show');
        if (!minesAutoBetting) startMinesGame();
    };

    function minesStartAuto() {
        const games = parseInt(document.getElementById('mines_auto_games').value);
        const picks = parseInt(document.getElementById('mines_auto_picks').value);

        if (isNaN(games) || games < 1) return alert('Invalid games count');
        if (isNaN(picks) || picks < 1) return alert('Invalid picks count');

        minesAutoBetting = true;
        minesAutoGamesLeft = games;
        updateMinesButton();
        minesRunAutoBet();
    }

    async function minesRunAutoBet() {
        if (!minesAutoBetting || minesAutoGamesLeft <= 0) {
            minesStopAuto('Auto-bet finished.');
            return;
        }

        const betAmount = parseFloat(document.getElementById('mines_betAmount').value);
        const mineCount = parseInt(document.getElementById('mines_mineCount').value);
        const picks = parseInt(document.getElementById('mines_auto_picks').value);

        if (betAmount > currentBalance) {
            return minesStopAuto('Auto-bet stopped: insufficient funds.');
        }

        try {
            // Start game
            const startData = await api('/games/mines/start', {
                method: 'POST',
                body: JSON.stringify({ betAmount, mineCount })
            });
            updateBalanceDisplay(startData.newBalance);
            playSound('bet');

            // Reveal tiles one by one
            const allTiles = Array.from({ length: 25 }, (_, i) => i);
            let hitMine = false;

            for (let i = 0; i < picks && !hitMine; i++) {
                if (!minesAutoBetting) return;

                const randomIdx = Math.floor(Math.random() * allTiles.length);
                const idx = allTiles.splice(randomIdx, 1)[0];

                await new Promise(r => setTimeout(r, 200));

                const revealData = await api('/games/mines/reveal', {
                    method: 'POST',
                    body: JSON.stringify({ tileIndex: idx })
                });

                if (revealData.hitMine) {
                    hitMine = true;
                    playSound('bomb');
                } else {
                    playSound('gem');
                }
            }

            // Cashout if not hit mine
            if (!hitMine) {
                const cashoutData = await api('/games/mines/cashout', { method: 'POST' });
                updateBalanceDisplay(cashoutData.newBalance);
                playSound('win');
            }

            minesAutoGamesLeft--;
            updateMinesButton();

            if (minesAutoGamesLeft > 0) {
                minesAutoTimeout = setTimeout(minesRunAutoBet, 1500);
            } else {
                minesStopAuto('Auto-bet finished.');
            }
        } catch (error) {
            minesStopAuto('Auto-bet error: ' + error.message);
        }
    }

    function minesStopAuto(reason) {
        if (!minesAutoBetting && !reason) return;
        minesAutoBetting = false;
        minesAutoGamesLeft = 0;
        clearTimeout(minesAutoTimeout);
        updateMinesButton();
        if (reason) alert(reason);
    }

    // =========== HOTLINE ===========
    async function startHotlineGame() {
        const spinBtn = document.getElementById('hotline_spin_btn');
        const betInput = document.getElementById('hotline_bet_amount');
        const reels = [
            document.getElementById('hotline_reel1'),
            document.getElementById('hotline_reel2'),
            document.getElementById('hotline_reel3')
        ];

        const symbolImages = {
            lemon: 'https://i.ibb.co/wr8pkJkG/file-0000000075d8622f9ecf6665274a29b4.png',
            cherry: 'https://i.ibb.co/bgTQ8mzw/file-00000000824461f8a0e0ea62c52ee25b.png',
            diamond: 'https://i.ibb.co/MD22rXYB/file-00000000ae1061f8acd84b9b9a00963a.png',
            seven: 'https://i.ibb.co/Xx8zKYV6/file-00000000ec7c61f5a7ee58f274e2b74d.png'
        };
        const symbols = Object.keys(symbolImages);

        if (spinBtn.dataset.listener) return;
        spinBtn.dataset.listener = 'true';

        spinBtn.addEventListener('click', async () => {
            const betAmount = parseFloat(betInput.value);
            if (isNaN(betAmount) || betAmount <= 0) return alert('Invalid bet');
            if (betAmount > currentBalance) return alert('Insufficient balance');

            spinBtn.disabled = true;
            spinBtn.textContent = 'Spinning...';
            playSound('spinLoop');

            // Animate reels while waiting
            const spinIntervals = reels.map(reel => setInterval(() => {
                const sym = symbols[Math.floor(Math.random() * symbols.length)];
                reel.innerHTML = `<img src="${symbolImages[sym]}" alt="${sym}">`;
            }, 100));

            try {
                const data = await api('/games/hotline/spin', {
                    method: 'POST',
                    body: JSON.stringify({ betAmount })
                });

                // Stop each reel with delay
                for (let i = 0; i < 3; i++) {
                    await new Promise(r => setTimeout(r, 500));
                    clearInterval(spinIntervals[i]);
                    playSound('reelStop');
                    reels[i].innerHTML = `<img src="${symbolImages[data.result[i]]}" alt="${data.result[i]}">`;
                }

                stopSound('spinLoop');
                updateBalanceDisplay(data.newBalance);

                if (data.isWin) {
                    showGenericDialog(true, 'Jackpot!', 'You Won', `+₹${data.profit.toFixed(2)}`);
                } else {
                    showGenericDialog(false, 'So Close!', 'You Lost', `-₹${Math.abs(data.profit).toFixed(2)}`);
                }
            } catch (error) {
                stopSound('spinLoop');
                alert(error.message);
            } finally {
                spinIntervals.forEach(clearInterval);
                spinBtn.disabled = false;
                spinBtn.textContent = 'Spin';
            }
        });
    }

    // =========== BALLOON ===========
    let balloonGame = null;

    function startBalloonGame() {
        const actionBtn = document.getElementById('balloon_action_btn');
        const betInput = document.getElementById('balloon_bet_amount');
        const multEl = document.getElementById('balloon_multiplier');
        const statusEl = document.getElementById('balloon_status');
        const iconEl = document.getElementById('balloon_icon');

        if (actionBtn.dataset.listener) return;
        actionBtn.dataset.listener = 'true';

        function reset() {
            balloonGame = null;
            stopSound('inflateLoop');
            multEl.textContent = '1.00x';
            multEl.style.color = 'var(--accent-green)';
            statusEl.textContent = 'Place your bet to start';
            actionBtn.textContent = 'Bet';
            actionBtn.className = 'btn btn-green';
            actionBtn.disabled = false;
            betInput.disabled = false;
            iconEl.classList.remove('rising');
            iconEl.textContent = '🎈';
        }

        actionBtn.addEventListener('click', async () => {
            if (!balloonGame) {
                // Start game
                const betAmount = parseFloat(betInput.value);
                if (isNaN(betAmount) || betAmount <= 0) return alert('Invalid bet');
                if (betAmount > currentBalance) return alert('Insufficient balance');

                actionBtn.disabled = true;

                try {
                    await api('/games/balloon/start', {
                        method: 'POST',
                        body: JSON.stringify({ betAmount })
                    });

                    // Deduct local balance
                    updateBalanceDisplay(currentBalance - betAmount);
                    playSound('bet');
                    playSound('inflateLoop');

                    balloonGame = {
                        betAmount,
                        multiplier: 1.00,
                        startTime: Date.now()
                    };

                    betInput.disabled = true;
                    actionBtn.disabled = false;
                    actionBtn.className = 'btn btn-primary';
                    statusEl.textContent = 'Balloon is rising...';
                    iconEl.classList.add('rising');

                    const tickInterval = setInterval(() => {
                        if (!balloonGame) return;

                        const elapsed = (Date.now() - balloonGame.startTime) / 1000;
                        balloonGame.multiplier = 1 + elapsed * 0.1 + Math.pow(elapsed, 1.5) * 0.02;
                        multEl.textContent = balloonGame.multiplier.toFixed(2) + 'x';
                        actionBtn.textContent = `Cashout at ${balloonGame.multiplier.toFixed(2)}x`;
                    }, 100);

                    balloonGame.tickInterval = tickInterval;
                } catch (error) {
                    alert(error.message);
                    actionBtn.disabled = false;
                }
            } else {
                // Cashout
                stopSound('inflateLoop');
                playSound('cashout');

                const mult = balloonGame.multiplier;
                const betAmount = balloonGame.betAmount;
                clearInterval(balloonGame.tickInterval);

                try {
                    const data = await api('/games/balloon/cashout', {
                        method: 'POST',
                        body: JSON.stringify({ multiplier: mult })
                    });

                    if (data.popped) {
                        // Balloon popped before cashout
                        playSound('pop');
                        statusEl.textContent = `POPPED at ${data.popMultiplier.toFixed(2)}x!`;
                        multEl.style.color = 'var(--accent-red)';
                        actionBtn.disabled = true;
                        iconEl.classList.remove('rising');
                        iconEl.textContent = '💥';

                        showGenericDialog(false, 'Popped!', 'You Lost', `-₹${betAmount.toFixed(2)}`);
                        setTimeout(reset, 2500);
                    } else {
                        updateBalanceDisplay(data.newBalance);
                        showGenericDialog(true, 'Cashed Out!', 'You Won', `+₹${data.profit.toFixed(2)}`);
                        reset();
                    }
                } catch (error) {
                    alert(error.message);
                    reset();
                }
            }
        });

        reset();
    }

    // =========== KENO ===========
    function startKenoGame() {
        const grid = document.getElementById('keno_grid');
        const infoEl = document.getElementById('keno_info');
        const drawBtn = document.getElementById('keno_draw_btn');
        const betInput = document.getElementById('keno_bet_amount');
        let selected = new Set();
        let isDrawing = false;

        function resetGrid() {
            grid.innerHTML = '';
            selected.clear();
            infoEl.textContent = 'Selected 0/10 numbers.';
            for (let i = 1; i <= 40; i++) {
                const numEl = document.createElement('div');
                numEl.className = 'keno-number';
                numEl.textContent = i;
                numEl.addEventListener('click', () => toggleNumber(numEl, i));
                grid.appendChild(numEl);
            }
        }

        function toggleNumber(el, num) {
            if (isDrawing) return;
            playSound('click');
            if (selected.has(num)) {
                selected.delete(num);
                el.classList.remove('selected');
            } else {
                if (selected.size < 10) {
                    selected.add(num);
                    el.classList.add('selected');
                } else {
                    alert('Maximum 10 numbers');
                }
            }
            infoEl.textContent = `Selected ${selected.size}/10 numbers.`;
        }

        if (!drawBtn.dataset.listener) {
            drawBtn.dataset.listener = 'true';
            drawBtn.addEventListener('click', async () => {
                const betAmount = parseFloat(betInput.value);
                if (isNaN(betAmount) || betAmount <= 0) return alert('Invalid bet');
                if (selected.size === 0) return alert('Select at least one number');
                if (betAmount > currentBalance) return alert('Insufficient balance');

                isDrawing = true;
                drawBtn.disabled = true;
                drawBtn.textContent = 'Drawing...';

                try {
                    const data = await api('/games/keno/draw', {
                        method: 'POST',
                        body: JSON.stringify({
                            selectedNumbers: Array.from(selected),
                            betAmount
                        })
                    });

                    // Highlight drawn numbers one by one
                    const allNumbers = grid.querySelectorAll('.keno-number');
                    for (const num of data.drawnNumbers) {
                        await new Promise(r => setTimeout(r, 150));
                        playSound('kenoDraw');
                        const el = allNumbers[num - 1];
                        el.classList.add('drawn');
                        if (selected.has(num)) {
                            el.classList.add('matched');
                        }
                    }

                    await new Promise(r => setTimeout(r, 800));
                    updateBalanceDisplay(data.newBalance);

                    if (data.winnings > 0) {
                        showGenericDialog(true, `Matched ${data.matches}!`, 'You Won', `+₹${data.profit.toFixed(2)}`);
                    } else {
                        showGenericDialog(false, 'No Luck!', 'You Lost', `-₹${betAmount.toFixed(2)}`);
                    }
                } catch (error) {
                    alert(error.message);
                } finally {
                    isDrawing = false;
                    drawBtn.disabled = false;
                    drawBtn.textContent = 'Start Draw';
                    setTimeout(resetGrid, 1000);
                }
            });
        }

        if (!grid.dataset.initialized) {
            resetGrid();
            grid.dataset.initialized = 'true';
        }
    }

        document.getElementById('generic_dialog_icon').textContent = isWin ? '🎉' : '😢';
        document.getElementById('generic_dialog_label').textContent = label;
        document.getElementById('generic_dialog_amount').textContent = amount;
        document.getElementById('generic_dialog_box').className = 
            isWin ? 'generic-dialog generic-win-dialog' : 'generic-dialog generic-loss-dialog';
        document.getElementById('generic_dialog_overlay').classList.add('show');
    }

    window.hideGenericDialog = function() {
        document.getElementById('generic_dialog_overlay').classList.remove('show');
    };

    // =========== CLEANUP ===========
    function stopAllGames() {
        if (ct_interval) clearInterval(ct_interval);
        ct_interval = null;
        if (balloonGame && balloonGame.tickInterval) clearInterval(balloonGame.tickInterval);
        Object.keys(soundEffects).forEach(stopSound);
    }

    // =========== INIT ===========
    document.addEventListener('DOMContentLoaded', async () => {
        // Mute button
        document.getElementById('mute-btn').addEventListener('click', () => {
            isMuted = !isMuted;
            document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
            if (isMuted) Object.keys(soundEffects).forEach(stopSound);
        });

        // Click sounds
        document.querySelectorAll('.btn, .nav-link, .game-card, .ct-number-btn, .ct-history-tabs .tab, .keno-number').forEach(el => {
            el.addEventListener('click', () => playSound('click'));
        });

        // Hide loader
        const loader = document.getElementById('loader-overlay');
        if (loader) {
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 500);
        }

        // Init dialogs
        initializeDepositDialog();
        initializeWithdrawDialog();
        initializeCtConfirmDialog();

        // CT how to play
        document.getElementById('ct_how_to_play_btn').addEventListener('click', () => {
            document.getElementById('ct-how-to-play-overlay').classList.add('show');
        });
        document.getElementById('close-how-to-play-dialog').addEventListener('click', () => {
            document.getElementById('ct-how-to-play-overlay').classList.remove('show');
        });
        document.getElementById('ct-how-to-play-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'ct-how-to-play-overlay') {
                e.target.classList.remove('show');
            }
        });

        // Tab switching for CT history
        document.querySelectorAll('.ct-history-tabs .tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.ct-history-tabs .tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.ct-history-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // Check auth
        if (authToken) {
            try {
                const user = await api('/auth/me');
                onLoginSuccess(user);
            } catch (error) {
                authToken = null;
                localStorage.removeItem('authToken');
                showAuthScreen();
            }
        } else {
            showAuthScreen();
        }
    });

    window.stopAllGames = stopAllGames;
